title: 'Component - Media Grid'
fields:
  -
    handle: media_items
    field:
      collapse: true
      max_sets: 8
      type: replicator
      display: 'Media items'
      localizable: false
      sets:
        extra_image:
          display: 'Extra media'
          sets:
            image:
              display: Media
              fields:
                -
                  import: media
  -
    handle: options
    field:
      mode: toggle
      type: revealer
      display: 'Component options'
      localizable: false
  -
    handle: component_options
    field:
      type: group
      display: 'Component options'
      always_save: true
      localizable: false
      if:
        options: 'equals true'
      fields:
        -
          import: anchor_id
