title: 'Component - Banner'
fields:
  -
    handle: display
    field:
      options:
        -
          key: container
          value: 'In container'
        -
          key: desktop_container
          value: 'Desktop only container'
        -
          key: full_width
          value: Fullscreen
      type: select
      display: Display
      default: container
      localizable: false
      width: 50
  -
    handle: size
    field:
      options:
        -
          key: compact
          value: Compact
        -
          key: normal
          value: Normal
      type: select
      display: Size
      default: normal
      localizable: false
      width: 50
  -
    import: media
  -
    import: link
  -
    handle: options
    field:
      mode: toggle
      type: revealer
      display: 'Component options'
      localizable: false
  -
    handle: component_options
    field:
      type: group
      display: 'Component options'
      always_save: true
      localizable: false
      if:
        options: 'equals true'
      fields:
        -
          import: anchor_id
