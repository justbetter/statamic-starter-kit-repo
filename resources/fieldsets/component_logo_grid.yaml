title: 'Component - Logo Grid'
fields:
  -
    handle: logos
    field:
      collapse: true
      max_sets: 8
      type: replicator
      display: Logos
      localizable: false
      sets:
        extra_logo:
          display: 'Extra logo'
          sets:
            logo:
              display: Logo
              fields:
                -
                  handle: logo
                  field:
                    max_files: 1
                    container: assets
                    type: assets
                    display: Logo
                    localizable: false
  -
    handle: options
    field:
      mode: toggle
      type: revealer
      display: 'Component options'
      localizable: false
  -
    handle: component_options
    field:
      type: group
      display: 'Component options'
      always_save: true
      localizable: false
      if:
        options: 'equals true'
      fields:
        -
          import: anchor_id
