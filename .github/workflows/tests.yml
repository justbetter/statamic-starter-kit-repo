name: tests

on: ["push", "pull_request"]

jobs:
    test:
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                os: [ubuntu-latest]
                php: [8.4, 8.5]
                laravel: [13.*]
                stability: [prefer-stable]
                include:
                    - laravel: 13.*
                      testbench: 11.*

        name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
                  coverage: none

            - name: Install dependencies
              run: |
                  php -r '$composer = json_decode(file_get_contents("composer.json"), true); unset($composer["require"]["just-better/laravel-healthchecks"], $composer["require"]["just-better/statamic-authentik"]); $composer["repositories"] = array_values(array_filter($composer["repositories"] ?? [], fn ($repository) => ($repository["url"] ?? null) !== "https://repo.justbetter.nl")); file_put_contents("composer.json", json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES).PHP_EOL);'
                  composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update --no-scripts
                  composer update --${{ matrix.stability }} --prefer-dist --no-interaction --no-scripts
            - name: Execute tests
              run: composer test
